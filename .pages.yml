
media:
  input: public/media/blog
  output: /media/blog
  rename: true

content:
  - name: posts
    label: Pausa do café
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, status, demo, publish_at]
      sort: [publish_at, title]
      default:
        sort: publish_at
        order: desc
    fields:
      - name: title
        label: Título do artigo
        type: string
        required: true

      - name: summary
        label: Resumo
        type: text
        required: true

      - name: category
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: identidade-visual
              label: Identidade visual
            - name: branding
              label: Branding
            - name: direcao-de-arte
              label: Direção de arte
            - name: processo
              label: Processo
            - name: tecnologia
              label: Tecnologia
            - name: referencias
              label: Referências

      - name: status
        label: Status editorial
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Rascunho
            - name: published
              label: Publicar ou agendar

      - name: demo
        label: Conteúdo demonstrativo (não listar publicamente)
        type: boolean
        default: false

      - name: publish_at
        label: Data e hora da publicação
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"

      - name: cover
        label: Imagem de capa
        type: image

      - name: cover_alt
        label: Texto alternativo da capa
        type: string

      - name: cover_position
        label: Enquadramento da capa (ex.: 50% 35%)
        type: string

      - name: seo_title
        label: Título para SEO
        type: string

      - name: seo_description
        label: Descrição para SEO
        type: text

      - name: body
        label: Conteúdo do artigo
        type: rich-text

  - name: translations_en
    label: Revisões em inglês
    type: collection
    path: src/i18n/reviews
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: slug
      fields: [title, review_status, source_hash]
    fields:
      - {name: slug, label: Slug original do artigo, type: string, required: true}
      - {name: title, label: Título em inglês, type: string, required: true}
      - {name: summary, label: Resumo em inglês, type: text, required: true}
      - {name: seo_title, label: SEO title, type: string}
      - {name: seo_description, label: Meta description, type: text}
      - {name: cover_alt, label: Descrição da imagem, type: string}
      - {name: source_hash, label: Hash do original revisado, type: string, required: true}
      - name: review_status
        label: Revisão editorial
        type: select
        options:
          values:
            - {name: draft, label: Em revisão}
            - {name: reviewed, label: Revisada e aprovada}
      - {name: body, label: Conteúdo em inglês, type: rich-text}
